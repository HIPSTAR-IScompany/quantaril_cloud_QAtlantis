name: Build and Deploy Q Atlantis (Sakura shared hosting)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # package.json engines: ">=18.0" を満たすLTS
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build (Docusaurus, ja locale)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          test -d build || (echo "build directory missing" && exit 1)
          test -f build/index.html || (echo "index.html missing" && exit 1)

      - name: Content pipeline check (transfer-queue)
        run: npm run content:check

      - name: Content ledger check (migration coverage)
        run: npm run content:check-ledger

      - name: Redirects check (migration/redirects.json vs build output)
        run: npm run content:check-redirects

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build/
          retention-days: 7

